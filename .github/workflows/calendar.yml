name: Refresh NBA calendars
on:
  push:
    paths: ['.github/workflows/calendar.yml']
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: calendar
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate feeds from ESPN schedule
        shell: python
        run: |
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen
          from datetime import datetime, timedelta, timezone
          data = {'gameDates': [], 'seasonYear': ''}
          for team in ['ny', 'phi']:
              for kind in [2, 3]:
                  url = f'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/{team}/schedule?seasontype={kind}'
                  with urlopen(Request(url, headers={'User-Agent':'Mozilla/5.0'}), timeout=60) as r:
                      payload = json.load(r)
                  if kind == 2:
                      assert payload.get('events'), 'Empty regular season schedule'
                  data['seasonYear'] = payload.get('season',{}).get('displayName','')
                  for e in payload.get('events',[]):
                      c = e['competitions'][0]
                      def team_info(side):
                          t = next(x['team'] for x in c['competitors'] if x['homeAway'] == side)
                          return {'teamTricode': {'NY':'NYK'}.get(t['abbreviation'],t['abbreviation']), 'teamName': t['displayName']}
                      v = c.get('venue',{})
                      dt = datetime.fromisoformat(e['date'].replace('Z','+00:00'))
                      status = c.get('status',{}).get('type',{}).get('description','')
                      g = {'gameId': e['id'], 'homeTeam':team_info('home'), 'awayTeam':team_info('away'), 'gameDateTimeUTC':e['date'] if e.get('timeValid',c.get('timeValid',True)) else None, 'gameStatusText':status, 'arenaName':v.get('fullName'), 'arenaCity':v.get('address',{}).get('city'), 'arenaState':v.get('address',{}).get('state')}
                      data['gameDates'].append({'gameDate': dt.strftime('%m/%d/%Y'), 'games':[g]})
          def esc(s):
              return str(s or '').replace(chr(92), chr(92)*2).replace(chr(10), chr(92)+'n').replace(';', chr(92)+';').replace(',', chr(92)+',')
          def fold(s):
              chunks, part = [], ''
              for c in s:
                  if len((part+c).encode()) > 75:
                      chunks.append(part)
                      part = ' '
                  part += c
              return '\r\n'.join(chunks+[part])
          feeds = {}
          for filename, teams, title in [('knicks-76ers', {'NYK','PHI'}, 'Knicks & 76ers'), ('knicks', {'NYK'}, 'New York Knicks'), ('76ers', {'PHI'}, 'Philadelphia 76ers')]:
              lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//NBA Calendar//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+title,'X-WR-TIMEZONE:America/New_York','X-PUBLISHED-TTL:PT12H']
              seen = set()
              for day in data['gameDates']:
                  for g in day['games']:
                      h, a = g['homeTeam'], g['awayTeam']
                      if not teams.intersection({h['teamTricode'],a['teamTricode']}):
                          continue
                      gid = str(g['gameId'])
                      if gid in seen:
                          continue
                      seen.add(gid)
                      status = g.get('gameStatusText','')
                      raw = g.get('gameDateTimeUTC')
                      tbd = not raw or 'TBD' in status.upper()
                      name = lambda t: (t.get('teamCity','')+' '+t.get('teamName',t['teamTricode'])).strip()
                      lines += ['BEGIN:VEVENT','UID:espn-nba-'+gid+'@nba-calendar','DTSTAMP:'+datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ'),'SUMMARY:'+esc(name(a)+' at '+name(h)+(' (time TBD)' if tbd else ''))]
                      if tbd:
                          d = datetime.strptime(day['gameDate'].split(' ')[0], '%m/%d/%Y')
                          lines += ['DTSTART;VALUE=DATE:'+d.strftime('%Y%m%d'),'DTEND;VALUE=DATE:'+(d+timedelta(days=1)).strftime('%Y%m%d')]
                      else:
                          d = datetime.fromisoformat(raw.replace('Z','+00:00')).astimezone(timezone.utc)
                          lines += ['DTSTART:'+d.strftime('%Y%m%dT%H%M%SZ'),'DTEND:'+(d+timedelta(hours=2,minutes=30)).strftime('%Y%m%dT%H%M%SZ')]
                      loc = ', '.join(filter(None,[g.get('arenaName'),g.get('arenaCity'),g.get('arenaState')]))
                      state = 'CANCELLED' if 'cancel' in status.lower() else 'TENTATIVE' if tbd or 'postpon' in status.lower() else 'CONFIRMED'
                      lines += ['LOCATION:'+esc(loc),'STATUS:'+state,'DESCRIPTION:NBA schedule via ESPN. Duration estimated at 2.5 hours.','URL:https://www.espn.com/nba/game/_/gameId/'+gid,'TRANSP:TRANSPARENT','END:VEVENT']
              assert seen, 'No games found; preserving existing feed'
              feeds[filename] = '\r\n'.join(map(fold, lines+['END:VCALENDAR']))+'\r\n'
              print(filename, len(seen), 'games; season', data.get('seasonYear'))
          Path('calendars').mkdir(exist_ok=True)
          for filename, content in feeds.items():
              Path('calendars',filename+'.ics').write_bytes(content.encode())
      - name: Publish feeds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add calendars
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh NBA calendar feeds'
          git push
